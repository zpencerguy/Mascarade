[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mascarade-sim"
version = "0.1.0"
description = "Dynamic-ontology simulator for the Repos edition of Mascarade."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Mascarade Simulator Contributors" }]
dependencies = []

[project.scripts]
mascarade-sim = "mascarade_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mascarade_sim = ["py.typed"]
